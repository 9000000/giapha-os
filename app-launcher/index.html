<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia Phả OS Launcher</title>
    <!-- Tạo giao diện tối giản, hiện đại để người dùng nhập URL Server vào -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg border border-stone-100 overflow-hidden">
        <!-- Header App -->
        <div class="bg-amber-700 p-6 text-center">
            <div class="w-16 h-16 bg-white/20 rounded-2xl mx-auto flex items-center justify-center mb-3 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white">Gia Phả OS</h1>
            <p class="text-amber-100 text-xs mt-1">Hệ thống Quản lý Gia tộc</p>
        </div>
        
        <!-- Main Form -->
        <div class="p-6">
            <form id="urlForm" class="mb-8">
                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-widest mb-2">Đường dẫn Máy chủ</label>
                <div class="relative">
                    <input type="url" id="urlInput" placeholder="https://..." required
                        class="w-full pl-4 pr-10 py-3 rounded-xl border border-stone-200 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all text-stone-800 font-medium">
                    <div class="absolute inset-y-0 right-0 p-1 flex items-center pr-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                    </div>
                </div>
                <button type="submit" 
                    class="mt-4 w-full bg-stone-900 hover:bg-black text-white font-semibold py-3.5 px-4 rounded-xl transition-all shadow-md active:scale-[0.98] flex justify-center items-center gap-2">
                    <span>Kết nối Máy chủ</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </form>

            <!-- History View -->
            <div>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-semibold text-stone-500 uppercase tracking-widest">Lịch sử kết nối</h2>
                    <span class="text-[10px] bg-stone-100 text-stone-500 px-2 py-0.5 rounded-full" id="historyCount">0</span>
                </div>
                <ul id="historyList" class="space-y-2 max-h-[160px] overflow-y-auto pr-1">
                    <!-- Được render bằng JS -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts logic -->
    <script>
        const urlForm = document.getElementById('urlForm');
        const urlInput = document.getElementById('urlInput');
        const historyList = document.getElementById('historyList');
        const historyCount = document.getElementById('historyCount');

        // Bắt đầu đọc lịch sử từ LocalStorage của App
        let history = JSON.parse(localStorage.getItem('serverHistory') || '[]');
        if (history.length === 0) {
            // Mặc định nạp 1 cái của Vercel
            history = ['https://giapha-os.vercel.app'];
            saveHistory();
        }

        function saveHistory() {
            localStorage.setItem('serverHistory', JSON.stringify(history));
        }

        function renderHistory() {
            historyList.innerHTML = '';
            historyCount.textContent = history.length;

            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-xs text-center text-stone-400 py-3 italic">Chưa có máy chủ nào được lưu</p>';
                return;
            }

            history.forEach(url => {
                const li = document.createElement('li');
                li.className = 'group flex items-center justify-between bg-white p-2.5 rounded-lg border border-stone-200 hover:border-amber-400 hover:shadow-sm transition-all cursor-pointer';
                li.onclick = (e) => {
                    // Tránh trigger khi bấm nút xóa
                    if(e.target.closest('button.delete-btn')) return;
                    connect(url);
                };
                
                // Icon server
                const iconDiv = document.createElement('div');
                iconDiv.className = 'w-8 h-8 rounded-full border border-stone-100 bg-stone-50 flex items-center justify-center shrink-0 text-stone-400 group-hover:text-amber-600 transition-colors';
                iconDiv.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>';

                const urlSpan = document.createElement('span');
                urlSpan.className = 'block ml-3 text-stone-700 text-sm font-medium truncate flex-1 group-hover:text-amber-700 transition-colors';
                urlSpan.textContent = url.replace(/^https?:\/\//, ''); // Ẩn http đi cho ngắn

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn ml-2 text-stone-300 hover:text-red-500 hover:bg-red-50 p-1.5 rounded-md transition-all active:scale-90';
                delBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    history = history.filter(h => h !== url);
                    saveHistory();
                    renderHistory();
                    
                    if(urlInput.value === url) {
                        urlInput.value = history[0] || '';
                    }
                };

                const flexDiv = document.createElement('div');
                flexDiv.className = 'flex items-center flex-1 overflow-hidden';
                flexDiv.appendChild(iconDiv);
                flexDiv.appendChild(urlSpan);

                li.appendChild(flexDiv);
                li.appendChild(delBtn);
                historyList.appendChild(li);
            });
        }

        function connect(url) {
            // Đẩy url này lên đầu danh sách và chỉ lưu 10 mốc lịch sử gần nhất
            history = [url, ...history.filter(h => h !== url)].slice(0, 10);
            saveHistory();
            
            // Chuyển hướng WebView bằng JS qua url đó
            // Ngay khi gọi lệnh này, Webview Capacitor sẽ navigate qua server
            window.location.href = url;
        }

        urlForm.onsubmit = (e) => {
            e.preventDefault();
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }
            connect(url);
        };

        renderHistory();
        urlInput.value = history[0] || ''; // Mặc định ở form là URL truy cập cuối
    </script>
</body>
</html>
